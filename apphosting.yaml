# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  maxInstances: 1

env:
  # Google Maps
  - variable: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    secret: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY

  # Firebase Client Config
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: NEXT_PUBLIC_FIREBASE_PROJECT_ID
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID

  # Analytics
  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    secret: NEXT_PUBLIC_GA_MEASUREMENT_ID
  - variable: NEXT_PUBLIC_META_PIXEL_ID
    secret: NEXT_PUBLIC_META_PIXEL_ID
  - variable: NEXT_PUBLIC_TIKTOK_PIXEL_ID
    secret: NEXT_PUBLIC_TIKTOK_PIXEL_ID
  - variable: NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_ID
    secret: NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_ID

  # Server-side secrets
  - variable: SENDGRID_API_KEY
    secret: SENDGRID_API_KEY
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
  - variable: DASHBOARD_PASSWORD
    secret: DASHBOARD_PASSWORD

  # Lead automation (hourly job in .github/workflows/lead-automation.yml)
  - variable: CRON_SECRET
    secret: CRON_SECRET

  # Optional SMS for the lead pipeline. Create each secret with
  #   firebase apphosting:secrets:set <NAME>
  # then uncomment. Without them, SMS steps are skipped and email still works.
  # - variable: TWILIO_ACCOUNT_SID
  #   secret: TWILIO_ACCOUNT_SID
  # - variable: TWILIO_AUTH_TOKEN
  #   secret: TWILIO_AUTH_TOKEN
  # - variable: TWILIO_PHONE_FROM
  #   secret: TWILIO_PHONE_FROM
  # - variable: KEN_MOBILE_NUMBER
  #   secret: KEN_MOBILE_NUMBER
